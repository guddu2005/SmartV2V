ktor {
    deployment {
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.smartv2v.ApplicationKt.module ]
    }
}

jwt {
    secret = "smartv2v-secret-jwt-key-2026-super-secure"
    issuer = "http://0.0.0.0:8080/"
    audience = "http://0.0.0.0:8080/v2v"
    realm = "SmartV2V Backend Server"
}

database {
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://localhost:5433/smartv2v_db"
    url = ${?DB_URL}
    user = "postgres"
    user = ${?DB_USER}
    password = "password"
    password = ${?DB_PASSWORD}
}

ml {
    serviceUrl = "http://localhost:8000/predict"
    serviceUrl = ${?ML_SERVICE_URL}
}
